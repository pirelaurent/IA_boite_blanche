<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="500" height="300" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond blanc -->
  <rect width="500" height="300" fill="white"/>
  
  <!-- Titre -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="black">
    Softmax : Amplification des écarts entre scores
  </text>
  
  <!-- Axes -->
  <line x1="50" y1="50" x2="50" y2="250" stroke="black" stroke-width="1.5"/>
  <line x1="50" y1="250" x2="450" y2="250" stroke="black" stroke-width="1.5"/>
  
  <!-- Labels des axes -->
  <text x="300" y="280" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="black">
    Entrées (scores bruts)
  </text>
  <text x="30" y="150" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="black" transform="rotate(-90, 30, 150)">
    Probabilité
  </text>
  
  <!-- Graduations de l'axe Y -->
  <line x1="45" y1="250" x2="50" y2="250" stroke="black" stroke-width="1"/>
  <text x="40" y="255" font-family="Arial, sans-serif" font-size="10" text-anchor="end" fill="black">0.0</text>
  
  <line x1="45" y1="200" x2="50" y2="200" stroke="black" stroke-width="1"/>
  <text x="40" y="205" font-family="Arial, sans-serif" font-size="10" text-anchor="end" fill="black">0.2</text>
  
  <line x1="45" y1="150" x2="50" y2="150" stroke="black" stroke-width="1"/>
  <text x="40" y="155" font-family="Arial, sans-serif" font-size="10" text-anchor="end" fill="black">0.4</text>
  
  <line x1="45" y1="100" x2="50" y2="100" stroke="black" stroke-width="1"/>
  <text x="40" y="105" font-family="Arial, sans-serif" font-size="10" text-anchor="end" fill="black">0.6</text>
  
  <line x1="45" y1="50" x2="50" y2="50" stroke="black" stroke-width="1"/>
  <text x="40" y="55" font-family="Arial, sans-serif" font-size="10" text-anchor="end" fill="black">0.8</text>
  
  <line x1="45" y1="75" x2="50" y2="75" stroke="black" stroke-width="1"/>
  <text x="40" y="80" font-family="Arial, sans-serif" font-size="10" text-anchor="end" fill="black">0.7</text>
  
  <line x1="45" y1="125" x2="50" y2="125" stroke="black" stroke-width="1"/>
  <text x="40" y="130" font-family="Arial, sans-serif" font-size="10" text-anchor="end" fill="black">0.5</text>
  
  <!-- Barres du softmax -->
  <!-- Score 2.0 -> 0.66 -->
  <rect x="100" y="116.5" width="80" height="133.5" fill="#1f77b4" stroke="black" stroke-width="1"/>
  <text x="140" y="260" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="black">Score 2.0</text>
  <text x="140" y="90" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="black">0.66</text>
  
  <!-- Score 1.0 -> 0.24 -->
  <rect x="200" y="183.6" width="80" height="66.4" fill="#ff7f0e" stroke="black" stroke-width="1"/>
  <text x="240" y="260" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="black">Score 1.0</text>
  <text x="240" y="157" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="black">0.24</text>
  
  <!-- Score 0.1 -> 0.10 -->
  <rect x="300" y="225" width="80" height="25" fill="#2ca02c" stroke="black" stroke-width="1"/>
  <text x="340" y="260" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="black">Score 0.1</text>
  <text x="340" y="222" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="black">0.10</text>
  
  <!-- Lignes de grille -->
  <line x1="50" y1="50" x2="450" y2="50" stroke="#cccccc" stroke-width="0.5" stroke-dasharray="2,2"/>
  <line x1="50" y1="100" x2="450" y2="100" stroke="#cccccc" stroke-width="0.5" stroke-dasharray="2,2"/>
  <line x1="50" y1="150" x2="450" y2="150" stroke="#cccccc" stroke-width="0.5" stroke-dasharray="2,2"/>
  <line x1="50" y1="200" x2="450" y2="200" stroke="#cccccc" stroke-width="0.5" stroke-dasharray="2,2"/>
  <line x1="50" y1="250" x2="450" y2="250" stroke="#cccccc" stroke-width="0.5" stroke-dasharray="2,2"/>
  
  <!-- Légende -->
  <text x="250" y="290" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666666">
    Le softmax amplifie les écarts : un score légèrement plus élevé devient une probabilité bien plus grande
  </text>
</svg>
